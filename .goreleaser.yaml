# goreleaser builds the static warden binaries that every distribution channel
# (npm wrapper, install.sh, brew, the self-installing hook) ships. One build,
# many channels — the binary is the single source of truth.
version: 2

project_name: warden

before:
  hooks:
    - go mod tidy

builds:
  - id: warden
    main: .
    binary: warden
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Stamp the release version into the binary's cli.Version.
    ldflags:
      - -s -w -X go.klarlabs.de/warden/internal/cli.Version={{ .Version }}

archives:
  - id: warden
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "warden_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Sign checksums.txt with cosign keyless (Sigstore: Fulcio cert + Rekor
# transparency log). The digest list that install.sh, install.ps1 and the
# self-fetching git hook verify downloads against is thereby itself verifiable
# — closing the "unsigned checksums" gap. Requires cosign on the release runner
# and `id-token: write` for the OIDC keyless flow (see release.yml).
#
# One `.bundle` rather than a `.sig` and a `.pem`. cosign 3 deprecated
# --output-signature/--output-certificate and refuses them outright unless
# --new-bundle-format is given; this release only kept working because the
# installer action was pinned to a version that still ships cosign 2, which
# means the format was one dependabot bump away from failing a release. The
# bundle also carries the Rekor inclusion proof, so a verifier fetches one
# asset instead of two and can check transparency-log membership offline.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: klarlabs-studio
    name: warden
  # Make a re-drive idempotent. release.yml has workflow_dispatch specifically
  # so a release whose brew push failed can be re-run without re-tagging -- but
  # by default goreleaser re-uploads every asset and dies on `422 already_exists`
  # BEFORE reaching the homebrew step, so the recovery path could never actually
  # recover. It failed exactly that way on v0.20.1, and unblocking it meant
  # deleting nine assets by hand -- the manual tap-fixing the dispatch trigger
  # exists to avoid.
  #
  # These are two different settings and only the second one does that job:
  # `mode` governs the release NOTES (keep-existing/append/prepend/replace),
  # while `replace_existing_artifacts` governs the uploaded ASSETS. Setting only
  # `mode: replace` left the artifact behaviour at its default, so the v0.20.2
  # re-drive failed identically to v0.20.1 -- the same 422, on every asset.
  mode: replace
  replace_existing_artifacts: true

homebrew_casks:
  # The cask belongs to the tap owned by the org that owns this repo, which
  # is also the scope the org secret behind TAP_GITHUB_TOKEN can write to.
  # A personal tap sits outside that scope and answers 403.
  - repository:
      owner: klarlabs-studio
      name: homebrew-tap
      # The default GITHUB_TOKEN is scoped to this repo only and cannot push to
      # the separate tap repo (403); use the dedicated tap PAT.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://go.klarlabs.de/warden
    description: Configurable git commit/push gate — native hooks, worktree isolation, cryptographic provenance
    license: MIT
    # The binary isn't notarized, so Gatekeeper quarantines it and the first
    # `warden` invocation hangs/blocks on an unsigned-binary check. Strip the
    # quarantine attribute on install so the CLI runs immediately.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/warden"]
          end
