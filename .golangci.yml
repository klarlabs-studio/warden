version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - misspell
    - gocritic
    - unconvert
    - unused
    - errcheck
    - unparam
  settings:
    staticcheck:
      # golangci-lint excludes the doc-comment-form checks by default. Five doc
      # comments had drifted onto the function BELOW the one they described —
      # a function inserted between a comment and its declaration leaves the
      # comment behind, and gofmt/vet/errcheck all stay silent because nothing
      # is syntactically wrong. ST1020 is what notices; it flagged exactly those
      # and nothing else, so this costs no noise and stops the class recurring.
      checks:
        - all
        - ST1020 # comment on exported function should be of the form "Fn ..."
        - ST1021 # comment on exported type should be of the form "T ..."
        - ST1022 # comment on exported var should be of the form "V ..."
    misspell:
      locale: US
      # GitHub's check-conclusion API value is the British "cancelled"; matching
      # it is correctness, not a typo.
      ignore-rules:
        - cancelled
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Warden passes domain value objects (ResolvedPolicy, RunRecord,
        # StepResult, …) by value on purpose: they are immutable value objects,
        # and pointer-izing them to save a copy on a rarely-called hook path
        # would reintroduce the shared-mutation risk the value semantics exist
        # to prevent. Keep the DDD design; drop this performance micro-opt.
        - hugeParam
  exclusions:
    rules:
      # Test files exercise error paths and fixtures that trip style checks
      # without improving the code under test.
      - path: _test\.go
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
