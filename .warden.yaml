agent: auto
hooks:
  pre_commit: true
  # pre-push writes + pushes the refs/notes/warden provenance the required
  # `gate` check depends on; keep it enabled so a hooks-sync can't drop the shim.
  pre_push: true
commands:
  # Mirror CI stage 1: golangci-lint runs gofmt/goimports formatters + govet +
  # staticcheck + gocritic, so one command is the whole quality gate.
  lint: "golangci-lint run ./..."
  # Mirror CI unit + e2e stages.
  test: "go test -race ./... && go test -tags e2e ./e2e/"
  # A config-defined custom step: any step name with a command here runs it —
  # no code, no installed binary. nox applies the committed .nox/baseline.json,
  # so only unwaived high/critical findings reach the gate — and of those, only
  # the ones this change introduced fail it (security_scan.mode, default delta).
  security-scan: "nox scan . -severity-threshold high"
steps:
  # `credentials` runs FIRST and in BOTH hooks. First because it is the only
  # step whose failure is unrecoverable by re-running: once a secret is in a
  # commit object it is in the reflog, and once pushed it is compromised
  # regardless of what the next commit removes. In both hooks because pre-commit
  # is the last point where "don't commit it" is still cheap advice — catching
  # it at pre-push means the secret already exists in history. It only reads the
  # files the change touched, so it costs nothing in the fast path.
  pre_commit: [credentials, lint]
  # pre-push mirrors CI order: secrets -> quality -> security -> tests.
  pre_push: [credentials, rebase, lint, security-scan, test]
security_scan:
  # The nox pin lives ONCE, centrally, in the shared reusable workflow every
  # klarlabs repo calls — so a search of THIS repo's workflows finds nothing and
  # the version-drift check was inert here (#112). This names WHERE the pin is,
  # never what it is: there is still exactly one copy of the version, in the
  # workflow that already defines it. Resolution is cached, and any failure
  # (offline, moved, renamed) degrades to "no pin" — never to a blocked push.
  #
  # Requires warden >= 0.20.0: older versions read pin_file as a repo-relative
  # path and fail the step outright.
  pin_file: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
risk:
  diff_lines_high: 400
  files_touched_high: 15
# Trusted provenance signers (ADR-0002 Phase 3). The warden-gate action (see
# .github/workflows/provenance.yml) and a bare `warden verify --range` require a
# note signed by one of these. Add yours with `warden key show`; list with
# `warden key list`.
trusted_keys:
  - 139e6eb9e2611c76 # felix — primary dev machine
  - b3746e61c4d49512 # recovery key — seed stored offline; restore into WARDEN_CONFIG_DIR to sign from a new machine
rules:
  # Large changes on main get a human approval gate at push time.
  - match:
      branch: main
      risk: high
    then:
      require_approval: true
