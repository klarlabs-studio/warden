name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    # No paths-ignore here: branch protection requires the reusable CI's status
    # checks (ci / Lint, Test, Build, Security) plus End-to-End, and a docs-only
    # PR that skips the whole workflow never reports them — so the PR is
    # unmergeable forever (this is why #19 needed an admin override). Running CI
    # on docs PRs is cheap (no code changed → cache hits) and keeps them
    # mergeable; push-to-main below still skips docs, saving minutes on merges.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-plan:
    name: Capture shadow plan
    runs-on: ubuntu-latest
    env:
      WARDEN_VERSION: '0.45.0'
      WARDEN_TRUSTED_KEYS: '139e6eb9e2611c76,b3746e61c4d49512,18df642847f69902'
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Execute only the reviewed planner. Candidate files are data, including
      # on forks; this job has no write permissions or persisted credentials.
      - name: Check out reviewed planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6942148ef6cd8608a5c23ad59130842f0ee27a1b
          path: trusted
          persist-credentials: false
      - name: Check out candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install released verifier
        run: bash "$GITHUB_WORKSPACE/trusted/.github/actions/install-warden.sh"
      - name: Capture original plan
        working-directory: candidate
        env:
          WARDEN_COMMIT: ${{ env.CANDIDATE_SHA }}
          WARDEN_PLAN_MODE: shadow
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/warden-original-plan"
          git fetch origin refs/notes/warden:refs/notes/warden || true
          export WARDEN_JOB_POLICY="$GITHUB_WORKSPACE/trusted/.github/warden/shadow-policy.json"
          bash "$GITHUB_WORKSPACE/trusted/.github/actions/ci-plan.sh" > "$RUNNER_TEMP/warden-original-plan/plan.json"
          jq -n --arg sha "$CANDIDATE_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg captured "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: 1, sha: $sha, run_id: ($run|tonumber), run_attempt: ($attempt|tonumber), captured_at: $captured}' \
            > "$RUNNER_TEMP/warden-original-plan/capture.json"
      - name: Retain original plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warden-ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/warden-original-plan/
          if-no-files-found: error
          retention-days: 30

  test-reuse-plan:
    name: Verify protected test reuse
    # Forks always execute CI. Never obtain the expected base/branch from notes.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      reuse-sha: ${{ steps.decision.outcome == 'success' && steps.decision.outputs.reuse-sha || '' }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      COMPARISON_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_CONTRACT: >-
        {"image":"ghcr.io/klarlabs-studio/warden/linux-test@sha256:070129904c8b4dd3be7e2fba92761d10c227a5d0bdf44c7993a49bb776cc22ad","config_id":"sha256:bafb4e708638a0e6af0e072f6931ba32b0eace8c7d6c7220984664acbdb9b1e7","platform":"linux/amd64","command":"/usr/local/bin/warden-linux-test","signing_identity":"https://github.com/klarlabs-studio/warden/.github/workflows/linux-test-image.yml@refs/heads/main"}
      WARDEN_TRUSTED_KEYS: '139e6eb9e2611c76,b3746e61c4d49512,18df642847f69902'
    steps:
      - name: Check out protected verifier and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 369231d82fe3563979dbf0b4cd036de5a347bab8
          path: trusted-reuse
          persist-credentials: false
      - name: Check out candidate objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: reuse-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: trusted-reuse/go.mod
          cache-dependency-path: trusted-reuse/go.sum
      # No candidate build, hook, configuration or executable runs in this job.
      - name: Build protected verifier
        working-directory: trusted-reuse
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/warden-reuse-bin"
          go build -o "$RUNNER_TEMP/warden-reuse-bin/warden" .
          go build -o "$RUNNER_TEMP/warden-reuse-bin/ci-policy" ./scripts/ci-policy
      - name: Prepare and verify exact test policy
        id: decision
        continue-on-error: true
        working-directory: reuse-candidate
        env:
          WARDEN_COMMIT: ${{ env.CANDIDATE_SHA }}
          WARDEN_PLAN_MODE: enforce
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$COMPARISON_BASE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          EXPECTED_BRANCH=$(jq -er '.pull_request.head.ref | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH")
          git check-ref-format "refs/heads/$EXPECTED_BRANCH"
          mkdir -p "$RUNNER_TEMP/warden-test-reuse"
          export PATH="$RUNNER_TEMP/warden-reuse-bin:$PATH"
          export WARDEN_JOB_POLICY="$RUNNER_TEMP/warden-test-reuse/policy.json"
          # Bind the protected template to the exact contract the caller runs.
          jq -e --argjson contract "$EXPECTED_CONTRACT" \
            --slurpfile receipt "$GITHUB_WORKSPACE/trusted-reuse/.github/warden/linux-test/profiles/amd64/publication.json" '
            .version == 1 and (.jobs | keys) == ["test"] and
            .jobs.test.version == 1 and (.jobs.test.steps | keys) == ["test"] and
            (.jobs.test.steps.test |
              .command == $contract.command and .image_id == $contract.config_id and
              .image_id_kind == "config" and .platform == $contract.platform and
              .network == "none") and
            ($receipt | length) == 1 and
            $receipt[0].registry_reference == $contract.image and
            $receipt[0].docker_config_id == $contract.config_id and
            $receipt[0].platform == $contract.platform and
            $receipt[0].signing_identity == $contract.signing_identity
          ' "$GITHUB_WORKSPACE/trusted-reuse/.github/warden/linux-test/profiles/amd64/docker-policy-template.json" >/dev/null
          ci-policy --repo "$PWD" \
            --template "$GITHUB_WORKSPACE/trusted-reuse/.github/warden/linux-test/profiles/amd64/docker-policy-template.json" \
            --base "$COMPARISON_BASE" --commit "$CANDIDATE_SHA" \
            --branch "$EXPECTED_BRANCH" > "$WARDEN_JOB_POLICY"
          git fetch origin refs/notes/warden:refs/notes/warden
          bash "$GITHUB_WORKSPACE/trusted-reuse/.github/actions/ci-plan.sh" \
            > "$RUNNER_TEMP/warden-test-reuse/plan.json"
          # ci-plan validates the complete policy partition. Only the single
          # expected test job may authorize the shared caller's reuse input.
          if jq -e -s --arg sha "$CANDIDATE_SHA" '
            length == 1 and (.[0] |
              .version == 1 and .mode == "enforce" and .sha == $sha and
              .run_jobs == [] and .reusable_jobs == ["test"] and
              .eligible_jobs == ["test"] and (.jobs | length) == 1 and
              .jobs[0].name == "test" and .jobs[0].action == "skip")
          ' "$RUNNER_TEMP/warden-test-reuse/plan.json" >/dev/null; then
            printf 'reuse-sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain protected reuse observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warden-test-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/warden-test-reuse/
          if-no-files-found: warn
          retention-days: 30

  # The shared klarlabs-studio Go CI: gofmt, golangci-lint (gocritic), race
  # tests, the coverctl coverage gate, and a nox security scan (SARIF -> code
  # scanning). Pinned tool/action versions live in one place and every repo
  # picks up the bump.
  ci:
    needs: [shadow-plan, test-reuse-plan]
    # An advisory planner failure must never suppress the ordinary checks.
    if: ${{ !cancelled() }}
    # Pinned to a commit, not @main. The shared bar defines what "passing"
    # means here, so leaving it floating lets anyone who can push to another
    # repository change this one's gate. Dependabot bumps it, which makes each
    # change a reviewable diff rather than a silent one.
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@0691e2eaa419a3998e4a3948ab765a9a8d4c3299 # container contract, .github PR #88
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      # Runtime tests run on Unix; Windows compilation is checked below.
      cross-platform: false
      # Only the protected verifier may supply an exact candidate reuse SHA.
      # A skipped/failed verifier emits nothing and leaves the container running.
      test-container-contract: >-
        {"image":"ghcr.io/klarlabs-studio/warden/linux-test@sha256:070129904c8b4dd3be7e2fba92761d10c227a5d0bdf44c7993a49bb776cc22ad","config_id":"sha256:bafb4e708638a0e6af0e072f6931ba32b0eace8c7d6c7220984664acbdb9b1e7","platform":"linux/amd64","command":"/usr/local/bin/warden-linux-test","signing_identity":"https://github.com/klarlabs-studio/warden/.github/workflows/linux-test-image.yml@refs/heads/main"}
      test-reuse-sha: ${{ needs.test-reuse-plan.outputs.reuse-sha || '' }}

  windows-build:
    needs: [shadow-plan]
    if: ${{ !cancelled() }}
    name: Windows compile (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Compile Windows packages
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # warden-specific end-to-end: build the binary and drive the real gate
  # (pre-commit, pre-push self-push + provenance notes, doctor bypass audit)
  # against throwaway git repos. Gated behind the shared CI so it runs only once
  # quality + security are green.
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    needs: [ci]
    env:
      WARDEN_CONTAINER_TEST_RUNTIME: docker
      # A multi-platform OCI index; the Ubuntu runner selects Linux amd64.
      WARDEN_CONTAINER_TEST_IMAGE: docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Configure git identity
        run: |
          git config --global user.email ci@warden.test
          git config --global user.name ci
      - name: Test remediation cleanup scope
        run: python3 -m unittest discover -s .github/scripts
      # Tests never pull images themselves. Preload the pinned fixture so the
      # Docker boundary and golden-fleet scenarios execute instead of skipping.
      - name: Load pinned container fixture
        run: docker pull "$WARDEN_CONTAINER_TEST_IMAGE"
      # Use an already published release: a release-preparation PR can advance
      # the component default before that new tag exists. After publication,
      # the test can exercise the new default without this version override.
      # The chain still checks pinned cosign, keyless signature over
      # checksums.txt, archive digest. Needs the network, so it is opt-in and
      # runs here rather than in every `go test ./...`.
      - name: Test GitLab component install chain
        env:
          WARDEN_GITLAB_INSTALL_VERSION: '0.43.0'
        run: WARDEN_GITLAB_INSTALL_NETWORK=1 go test ./scripts -run '^TestGitLabTemplate_InstallRealRelease$' -count=1 -v
      - name: Test Docker execution boundary
        run: go test -race ./internal/infrastructure/steps -run '^(TestContainerExecutionIntegration|TestContainerLimitsReachTheCgroup)$' -count=1 -v
      # -count=1 is REQUIRED, not hygiene. These tests drive a separately built
      # binary, so the test package's own inputs never change when internal/**
      # does — Go replays a cached PASS and the suite silently stops running.
      # See the note in e2e/e2e_test.go.
      - name: Run e2e tests
        run: WARDEN_E2E=1 go test ./e2e/ -v -count=1

  # The same live boundary checks as the Docker run above, against the other
  # two Docker-compatible engines warden supports. Both run ROOTLESS, as the
  # runner user, because that is the only way warden can drive them: warden
  # invokes the engine CLI as the user who runs the hook, and rootful
  # nerdctl/Podman would need warden itself to run as root.
  container-runtimes:
    name: Container runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, nerdctl]
    env:
      WARDEN_CONTAINER_TEST_RUNTIME: ${{ matrix.runtime }}
      WARDEN_CONTAINER_TEST_IMAGE: docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
      NERDCTL_VERSION: 2.4.1
      NERDCTL_SHA256: ff018f11ac2f1354bf7b3aaaca6e0b52d81139c746a89134744d0b7be3a0e62f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Configure git identity
        run: |
          git config --global user.email ci@warden.test
          git config --global user.name ci
      # Podman ships on the Ubuntu runner image. Fail here, not in a skipped
      # test, if that ever stops being true.
      - name: Check Podman
        if: matrix.runtime == 'podman'
        run: |
          podman version
          podman info --format 'rootless={{.Host.Security.Rootless}}'
      # nerdctl-full bundles containerd, runc, RootlessKit, slirp4netns, CNI
      # and BuildKit. Rootless containerd runs as a systemd user service, so
      # the runner user needs a lingering user manager. Ubuntu 24.04 confines
      # unprivileged user namespaces through AppArmor; RootlessKit needs the
      # profile nerdctl's rootless guide documents.
      - name: Install rootless nerdctl
        if: matrix.runtime == 'nerdctl'
        run: |
          archive="nerdctl-full-${NERDCTL_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/${archive}"
          echo "${NERDCTL_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          sudo tar -C /usr/local -xzf "$RUNNER_TEMP/$archive"
          cat <<'PROFILE' | sudo tee /etc/apparmor.d/usr.local.bin.rootlesskit >/dev/null
          abi <abi/4.0>,
          include <tunables/global>

          /usr/local/bin/rootlesskit flags=(unconfined) {
            userns,
            include if exists <local/usr.local.bin.rootlesskit>
          }
          PROFILE
          sudo systemctl reload apparmor.service
          sudo loginctl enable-linger "$(id -un)"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          containerd-rootless-setuptool.sh install
          nerdctl version
          nerdctl info --format '{{json .SecurityOptions}}'
      # Tests never pull images themselves. Preload the pinned fixture into
      # this engine's own store so the scenarios execute instead of skipping.
      - name: Load pinned container fixture
        run: ${{ matrix.runtime }} pull "$WARDEN_CONTAINER_TEST_IMAGE"
      - name: Test ${{ matrix.runtime }} execution boundary
        run: go test -race ./internal/infrastructure/steps -run '^(TestContainerExecutionIntegration|TestContainerLimitsReachTheCgroup)$' -count=1 -v
      # -count=1 for the same reason as the e2e job above.
      - name: Run golden-fleet container scenarios
        run: WARDEN_E2E=1 go test ./e2e/ -run '^TestGoldenFleet_(ContainerEvidenceRequiresObservedExecution|StagedPredictionIsLocalExactAndInvalidated|RetaggedImageReEvaluatesTheStagedWatch|FeedbackStatusMatchesReality|GateIgnoresForgedFeedback|FeedbackFollowsACommitDuringACheck|FeedbackAfterAWatcherCrash|FeedbackPerWorktree|StrictConformanceNeedsNetworkNone|MinProfileStrictPassesOnARealStrictNote)$' -v -count=1
