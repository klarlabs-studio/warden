name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    # No paths-ignore here: branch protection requires the reusable CI's status
    # checks (ci / Lint, Test, Build, Security) plus End-to-End, and a docs-only
    # PR that skips the whole workflow never reports them — so the PR is
    # unmergeable forever (this is why #19 needed an admin override). Running CI
    # on docs PRs is cheap (no code changed → cache hits) and keeps them
    # mergeable; push-to-main below still skips docs, saving minutes on merges.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared klarlabs-studio Go CI: gofmt, golangci-lint (gocritic), race
  # tests, the coverctl coverage gate, and a nox security scan (SARIF -> code
  # scanning). Pinned tool/action versions live in one place and every repo
  # picks up the bump.
  ci:
    # Pinned to a commit, not @main. The shared bar defines what "passing"
    # means here, so leaving it floating lets anyone who can push to another
    # repository change this one's gate. Dependabot bumps it, which makes each
    # change a reviewable diff rather than a silent one.
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@4b0f34c9c8efdfe6bb4aa9854e569f894f896118 # main, 2026-08-10
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      # unix-first: native git hooks, disposable worktrees, and a unix-socket
      # attach channel — no OS-specific matrix needed.
      cross-platform: false

  # warden-specific end-to-end: build the binary and drive the real gate
  # (pre-commit, pre-push self-push + provenance notes, doctor bypass audit)
  # against throwaway git repos. Gated behind the shared CI so it runs only once
  # quality + security are green.
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Configure git identity
        run: |
          git config --global user.email ci@warden.test
          git config --global user.name ci
      # -count=1 is REQUIRED, not hygiene. These tests drive a separately built
      # binary, so the test package's own inputs never change when internal/**
      # does — Go replays a cached PASS and the suite silently stops running.
      # See the note in e2e/e2e_test.go.
      - name: Run e2e tests
        run: WARDEN_E2E=1 go test ./e2e/ -v -count=1
