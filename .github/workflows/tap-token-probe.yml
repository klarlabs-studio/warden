# TEMPORARY. Deleted with the branch.
# Fingerprints the credential in secrets.HOMEBREW_TAP_TOKEN so it can be
# identified among several tokens, without printing any part of its value.
name: Tap token probe
on:
  push:
    branches: ["chore/tap-token-probe"]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint the credential
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Token TYPE only, from the documented prefix. Never the value.
          case "$TOKEN" in
            github_pat_*) echo "type: fine-grained PAT (github_pat_...)" ;;
            ghp_*)        echo "type: classic PAT (ghp_...)" ;;
            gho_*|ghs_*)  echo "type: OAuth/app token" ;;
            *)            echo "type: unrecognised prefix" ;;
          esac
          echo "length: ${#TOKEN} characters"

          echo "--- identity ---"
          curl -sS -H "Authorization: Bearer $TOKEN" https://api.github.com/user \
            | jq -r '"login: \(.login // "n/a")  id: \(.id // "n/a")"'

          echo "--- every repository this token can reach (its fingerprint) ---"
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/user/repos?per_page=100" \
            | jq -r 'if type=="array" then (.[].full_name) else "error: \(.message)" end' \
            | sort | sed 's/^/  /'
