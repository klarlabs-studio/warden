# TEMPORARY diagnostic. Delete with the branch.
#
# The tap push 403s and the three plausible causes need different fixes:
# wrong resource owner (re-mint), Contents:Read (edit), or a stale token
# string in the secret (re-paste). This distinguishes them without anyone
# handling the token: it runs inside Actions, where the secret is already
# available, and prints only booleans. GitHub masks secret values in logs,
# and none of the API responses echoed here contain the credential.
name: Tap token probe
on:
  push:
    branches: ["chore/tap-token-probe"]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe tap credential capability
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "VERDICT: secret is EMPTY — not readable by this repo"
            exit 0
          fi
          echo "secret is present (length hidden)"

          code=$(curl -sS -o /tmp/repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/felixgeelhaar/homebrew-tap)
          echo "GET /repos/felixgeelhaar/homebrew-tap -> HTTP $code"

          if [ "$code" = "404" ]; then
            echo "VERDICT: token CANNOT SEE the tap — wrong resource owner. Not fixable by editing; re-mint under felixgeelhaar."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "VERDICT: unexpected status $code"
            jq -r '.message // "no message"' /tmp/repo.json
            exit 0
          fi

          # .permissions reflects what the ACCOUNT can do, not what this TOKEN
          # is granted -- a Contents:Read fine-grained PAT still reports
          # push=true here. So probe the write path directly, with a request
          # that cannot modify anything: PUT an existing file with a
          # deliberately wrong blob sha.
          #   403 -> no write grant (Contents is Read, or repo not selected)
          #   409/422 -> write IS granted; only the sha was rejected
          sha=$(jq -r '.sha' /tmp/repo.json >/dev/null 2>&1; echo "0000000000000000000000000000000000000000")
          body=$(printf '{"message":"probe (never applied)","content":"cHJvYmU=","sha":"%s"}' "$sha")
          wcode=$(curl -sS -o /tmp/w.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$body" \
            https://api.github.com/repos/felixgeelhaar/homebrew-tap/contents/Casks/warden.rb)
          echo "PUT (intentionally-bad sha) -> HTTP $wcode"
          jq -r '.message // "no message"' /tmp/w.json

          case "$wcode" in
            403) echo "VERDICT: NO WRITE GRANT. Contents is Read, or the tap is not in the token's selected repositories." ;;
            409|422) echo "VERDICT: WRITE IS GRANTED (only the sha was rejected). The 403 in goreleaser then means the org secret holds a DIFFERENT token string -- re-paste it." ;;
            200|201) echo "VERDICT: WRITE GRANTED and the file was MODIFIED -- unexpected, check the tap." ;;
            *) echo "VERDICT: unexpected status $wcode" ;;
          esac
