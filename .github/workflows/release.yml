name: Release

on:
  push:
    # Full semver tags only (v0.16.0, v0.17.0-rc1). The floating major tag the
    # major-tag job maintains (v0) has no dots, so moving it never re-triggers a
    # release.
    tags: ["v*.*.*"]
  # Re-drive a release without re-tagging. v0.19.0 needed exactly this: the
  # GitHub Release and npm package published, then the brew cask failed on a
  # stale tap PAT — and with no manual trigger the only ways forward were
  # deleting and re-pushing the tag, or fixing the cask by hand.
  # Dispatch against the TAG itself (`--ref v0.19.0`): goreleaser and the
  # major-tag job both read GITHUB_REF_NAME, so no input is needed and there is
  # no second place for the version to be wrong.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # cosign keyless signing of checksums.txt (OIDC → Fulcio)

# A tag must produce exactly one release run — two concurrent runs race to
# upload the same asset names and both fail with 422 already_exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the binaries + GitHub Release + brew formula.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # cosign is invoked by goreleaser's `signs:` block to sign checksums.txt.
      # The version is named here rather than inherited from the action's
      # default, which moved from v2 to v3 between installer releases — and v3
      # rejects flags v2 accepted. Which cosign signed a release should be
      # readable in this file, not inferred from an action SHA.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # goreleaser reaches the tap push at the very END of a release, after the
      # binaries are built, signed, and uploaded. A tap credential that is empty
      # or unauthorized therefore fails a release that has already half-shipped,
      # and it fails as an HTTP status from a git push rather than as a name.
      # Both tap failures to date were read wrong from that vantage point: 401
      # at v0.19.0 was diagnosed as an expired PAT when the secret name was
      # simply misspelled (an undefined secret expands to the empty string, not
      # an error), and 403 at 0.20.0 as the same. Assert the credential here,
      # before anything is published, and say which of the two it is.
      # The wording of the messages below is deliberate, so please do not
      # "tidy" it. Two nox rules match this step's ERROR TEXT rather than its
      # behaviour: SEC-163 reads the secret's name as a high-entropy hex string
      # when it carries the `secrets.` prefix, and IAC-314 reads the colon form
      # of the write-permission name, quoted inside an English sentence, as a
      # permission this workflow grants. Both are false positives on prose —
      # but SARIF is not baseline-filtered, so they arrive as PR review threads
      # and block the merge under required_conversation_resolution. Naming the
      # secret without the prefix, and spelling the permission out in words,
      # keeps the messages actionable and the scanner quiet. The genuine
      # permission declarations in this file are still flagged, as they should
      # be.
      - name: Check the tap credential
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::error::the tap credential is empty: this workflow asked" \
                 "for HOMEBREW_TAP_TOKEN and got nothing back. An undefined" \
                 "secret expands to an empty string rather than failing, so this" \
                 "is a NAME problem, not an expired token — check the secret's" \
                 "exact spelling in the klarlabs-studio org settings, and that" \
                 "this repository is on its access list."
            exit 1
          fi
          # Distinguish "no credential" (401) from "credential refused" (403)
          # while the release can still be abandoned cheaply. Only the status
          # code is echoed; the body may quote the request.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TAP_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/klarlabs-studio/homebrew-tap)
          case "$code" in
            200) echo "tap credential accepted (200)" ;;
            401) echo "::error::401 from the tap repo: the credential was not" \
                      "accepted at all. The secret holds something, but GitHub" \
                      "rejected it — expired or malformed token." ; exit 1 ;;
            403) echo "::error::403 from the tap repo: the credential was" \
                      "presented and refused. It authenticates but lacks" \
                      "write access to klarlabs-studio/homebrew-tap, or its" \
                      "fine-grained resource owner is wrong (that owner is" \
                      "immutable — re-mint rather than edit permissions)." ; exit 1 ;;
            404) echo "::error::404 from the tap repo: the credential cannot" \
                      "see klarlabs-studio/homebrew-tap. For a fine-grained" \
                      "token this is indistinguishable from no access." ; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code from the tap repo." ; exit 1 ;;
          esac

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exact, not a range. A release is the artifact that most needs to be
          # reproducible from what this file says.
          version: "2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scopes the tap-repo push for the brew cask. Sourced from the ORG
          # secret so there is exactly one place to rotate: the same credential
          # previously lived under three names across the repos publishing
          # to klarlabs-studio/homebrew-tap, and updating one of them left the
          # others stale — that is how v0.19.0 shipped with a 401 and 0.20.0
          # with a 403. The env var keeps its name because .goreleaser.yaml
          # reads {{ .Env.TAP_GITHUB_TOKEN }}; only the source changes.
          # The org secret is named HOMEBREW_TAP_TOKEN. An undefined secret
          # expands to an empty string rather than failing, so asking for the
          # unprefixed name sent an empty credential and got 401 Bad
          # credentials (401, not 403 — no credential presented at all).
          TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Attach CycloneDX + SPDX SBOMs to the release, matching fortify/mcp/
      # statekit. nox scan exits non-zero on findings (even baselined) — SBOM
      # generation must not gate on that, so tolerate the exit code and verify
      # the artifacts before uploading them to the goreleaser-created release.
      - name: Generate + attach SBOM
        # Run even when goreleaser failed, and decide from the RELEASE rather
        # than from the step's exit code — the rule the major-tag job below
        # already learned, from the same cause.
        #
        # goreleaser publishes the release and THEN pushes the brew cask. A
        # stale tap credential fails that last step, which used to skip this one
        # entirely: v0.31.0 published its binaries, checksums and cosign bundle
        # and shipped with NO SBOMs, because a Homebrew token had expired. For a
        # tool whose subject is supply-chain provenance, losing the supply-chain
        # artifacts to an unrelated credential is the wrong thing to lose.
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          # The honest guard: attach SBOMs if and only if a release exists to
          # attach them to. A goreleaser that died BEFORE publishing leaves
          # nothing here to do, and the run has already failed loudly for that
          # reason — a second failure would only obscure the first.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::warning::no release exists for ${GITHUB_REF_NAME}, so no SBOMs were attached." \
                 "goreleaser failed before publishing; fix that, then re-drive this workflow."
            exit 0
          fi
          go install github.com/nox-hq/nox/cli@v0.8.1
          mv "$(go env GOPATH)/bin/cli" "$(go env GOPATH)/bin/nox"
          mkdir -p release-artifacts
          # nox exits non-zero on findings, even baselined ones. SBOM generation
          # must not gate on that, so the exit code is tolerated and the
          # ARTIFACTS are checked instead — a green scan that produced no file
          # would otherwise upload nothing and say nothing.
          nox -format cdx,spdx -output release-artifacts scan . || true
          test -s release-artifacts/sbom.cdx.json
          test -s release-artifacts/sbom.spdx.json
          gh release upload "${GITHUB_REF_NAME}" \
            release-artifacts/sbom.cdx.json \
            release-artifacts/sbom.spdx.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # nox's own Go floor can move past warden's; setup-go pins
          # GOTOOLCHAIN=local, which turns that into "requires go >= X" and
          # kills the step. Scoped to this step only, so the release build
          # itself stays on the toolchain go.mod names.
          GOTOOLCHAIN: auto

  # Assemble the per-platform npm packages from the same binaries and publish
  # them + the main wrapper. The wrapper carries no logic — just launches the
  # binary — so npm is purely a delivery channel.
  # Independent of goreleaser: it rebuilds the binaries itself and only touches
  # npm, so a brew/tap hiccup in goreleaser never blocks the npm channel.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # registry-url IS required. The official npm trusted-publishing docs example
      # sets it, and setup-node's registry-url is what points npm at npmjs and lets
      # its OIDC detection engage. Omitting it (an earlier misreading) left npm on
      # no explicit registry → it never entered the trusted-publishing path and
      # fell back to token auth → ENEEDAUTH. Node 24's bundled npm is >= 11.5.1
      # (the floor); no force-install needed.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Report toolchain
        run: echo "node $(node -v) / npm $(npm -v)"
      # The SAME pinned action the goreleaser job uses, for the same reason it
      # uses it: the action ships a goreleaser binary, so the release does not
      # depend on the runner's Go being new enough to COMPILE goreleaser.
      #
      # This step used to be `go run github.com/goreleaser/goreleaser/v2@latest`.
      # Two faults in one line. `@latest` is unpinned, so the release toolchain
      # could change under a tag that had already been tested. And building it
      # from source binds the release to goreleaser's Go floor: on v0.30.1 that
      # floor moved to 1.27, warden targets 1.26, setup-go pins GOTOOLCHAIN=local
      # — and the npm channel silently did not publish while every other channel
      # did. AGENTS.md already records this shape from the nox install step.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # The SAME exact version the release job uses. This job builds the
          # binaries that npm users install, so a floating range here means the
          # npm artifacts for a given tag are built by whichever 2.x happened to
          # be newest that day, while the GitHub and Homebrew artifacts for that
          # same tag come from the pinned one. One version, two builders.
          version: "2.16.0"
          args: build --clean --snapshot=false
      - name: Assemble npm packages
        run: node npm/scripts/build-packages.mjs "${GITHUB_REF_NAME#v}"
      # npm trusted publishing (OIDC). registry-url (above) is what makes the npm
      # CLI engage OIDC — it signs provenance and authenticates without a real
      # token. Do NOT override NODE_AUTH_TOKEN with "": that empties the .npmrc
      # token and npm then ENEEDAUTHs instead of using OIDC (confirmed on v0.18.14).
      # setup-node's default placeholder token is harmless here. Any remaining 404
      # is a trusted-publisher authorization match on npmjs (org/repo/workflow/
      # environment/allowed-action must match exactly), not a workflow issue.
      # Publish from INSIDE each package dir (cd).
      # A version already on the registry is SKIPPED, not an error.
      #
      # npm versions are immutable, so re-driving a release — the documented
      # recovery path, used whenever a later channel fails — always died here
      # with "You cannot publish over the previously published versions". The
      # run then reported FAILURE with every channel actually correct, and the
      # v0.31.0 re-drive did exactly that: the tap and the SBOMs were repaired
      # and the workflow still went red, so anyone reading the status alone
      # would go hunting for a problem that had just been fixed.
      #
      # The skip is narrow on purpose. It fires only when the registry already
      # holds this exact name@version; any other publish failure — auth, OIDC,
      # network — still fails the step. And `npm view` erroring is treated as
      # "not published", so a network blip makes us ATTEMPT the publish rather
      # than assume it happened: wrong in the safe direction.
      #
      # If a published version's content ever differs from this build, skipping
      # is still right — npm will not accept a republish either. The fix for
      # that is a new version, never a forced overwrite.
      - name: Publish platform packages
        run: |
          set -euo pipefail
          published=0 skipped=0
          for d in npm/packages/*/; do
            name=$(node -p "require('./$d/package.json').name")
            version=$(node -p "require('./$d/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version already published; skipping."
              skipped=$((skipped + 1))
              continue
            fi
            ( cd "$d" && npm publish --provenance --access public )
            published=$((published + 1))
          done
          echo "platform packages: $published published, $skipped already present"
          # Nothing to do at all is the ordinary re-drive case and is fine — but
          # it must be visible, not inferred from a green tick.
          if [ "$published" -eq 0 ] && [ "$skipped" -gt 0 ]; then
            echo "::notice::every platform package was already published — this re-drive published nothing."
          fi
      - name: Publish wrapper
        run: |
          set -euo pipefail
          name=$(node -p "require('./npm/package.json').name")
          version=$(node -p "require('./npm/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version already published; skipping."
            exit 0
          fi
          cd npm && npm publish --provenance --access public

  # Move a floating major-version tag (v0, v1, …) onto this release so consumers
  # can pin the reusable action as `warden-gate@v0` and track the latest release
  # within the major line. Runs only after both delivery channels publish, so the
  # tag never advances to a half-released version. Its own tag push is filtered
  # out of this workflow's trigger (v*.*.* — the bare major has no dots), so it
  # can't re-trigger a release. Prereleases don't move it. Consumers wanting an
  # immutable ref pin an exact version or commit SHA (see docs/ci-provenance-gate.md).
  major-tag:
    needs: [goreleaser, npm]
    # Run even when goreleaser failed, and decide from the RELEASE rather than
    # from the job's exit code. goreleaser publishes the release and then pushes
    # the brew cask; a failure in that last, cosmetic step used to skip this job
    # entirely, stranding the floating major tag on the previous version while
    # the docs tell consumers to reference `@v0`. That is exactly what happened
    # on v0.19.0 — a stale tap PAT left every action consumer silently pinned to
    # 0.18.16 until the tag was moved by hand.
    #
    # The guard below is the honest condition: move the tag if and only if a
    # real release exists for it. A goreleaser that died before publishing moves
    # nothing.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-push the floating major tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move floating major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"    # e.g. v0.16.0
          case "$tag" in
            *-*) echo "prerelease $tag: leaving the major tag where it is"; exit 0 ;;
          esac
          # Publishing is what the tag points consumers at, so require it — a
          # draft or absent release means there is nothing to point them to.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" != "false" ]; then
            echo "no published release for $tag: leaving the major tag where it is"
            exit 1
          fi
          major="${tag%%.*}"          # e.g. v0
          # Lightweight on purpose: a signed annotated tag here would be moved by
          # force on every release, so the signature would assert nothing.
          git tag -f "$major" "${GITHUB_SHA}"
          git push -f origin "refs/tags/$major"
          echo "moved $major -> $tag (${GITHUB_SHA})"

env:
  GO_VERSION: "1.26.x"
