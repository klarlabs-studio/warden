# A read-only probe for the Homebrew tap credential.
#
# goreleaser reaches the tap push only at the END of a release, after the
# binaries are built, signed and uploaded, so a bad credential fails a release
# that has already half-shipped. release.yml guards against that inline, but the
# guard only ever runs during a release — which makes "does this credential
# work?" a question you can otherwise only answer by cutting one.
#
# This workflow answers it on demand, without publishing anything. Use it before
# a release, after rotating the token, and after changing which repositories an
# org secret is shared with.
name: Tap credential check

on:
  workflow_dispatch:

# Read-only: this workflow authenticates and reports. It never writes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The wording of the messages below is deliberate, so please do not
      # "tidy" it — see the same note in release.yml. Two nox rules match this
      # step's error TEXT rather than its behaviour, and SARIF is not
      # baseline-filtered, so the findings arrive as PR review threads.
      - name: Probe the tap credential
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::error::the tap credential is empty: this workflow asked" \
                 "for HOMEBREW_TAP_TOKEN and got nothing back. An undefined" \
                 "secret expands to an empty string rather than failing, so" \
                 "this is a NAME problem, not an expired token — check the" \
                 "spelling in the klarlabs-studio org settings, and that this" \
                 "repository is on the secret's access list."
            exit 1
          fi
          echo "credential is non-empty (${#TAP_GITHUB_TOKEN} chars)"

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TAP_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/klarlabs-studio/homebrew-tap)
          echo "GET /repos/klarlabs-studio/homebrew-tap -> $code"

          case "$code" in
            200) echo "::notice::tap credential authenticates and can see the tap repo." ;;
            401) echo "::error::401 — the credential was not accepted. It holds" \
                      "something, but GitHub rejected it: expired or malformed." ; exit 1 ;;
            403) echo "::error::403 — presented and refused. It authenticates but" \
                      "lacks write access to the tap repo, or its fine-grained" \
                      "resource owner is wrong (that owner is immutable — re-mint" \
                      "rather than edit permissions)." ; exit 1 ;;
            404) echo "::error::404 — the credential cannot see the tap repo. For" \
                      "a fine-grained token this is indistinguishable from having" \
                      "no access to it." ; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code from the tap repo." ; exit 1 ;;
          esac

          # Reading the repo proves it authenticates; it does not prove it can
          # PUSH. Ask about permissions explicitly so a read-only token cannot
          # pass this check and then fail the actual cask push.
          perm=$(curl -sS \
            -H "Authorization: Bearer ${TAP_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/klarlabs-studio/homebrew-tap \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("permissions",{}).get("push"))')
          echo "permissions.push = $perm"
          if [ "$perm" != "True" ] && [ "$perm" != "true" ]; then
            echo "::error::the credential can READ the tap repo but reports" \
                 "push=$perm. goreleaser needs to push the cask, so a release" \
                 "would still fail at the last step. (null = the field was not" \
                 "returned at all, which usually means the wrong owner.)"
            exit 1
          fi
          echo "::notice::tap credential is usable: authenticated, visible, and push-capable."
