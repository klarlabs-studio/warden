name: Linux test contract

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/linux-test-contract.yml'
      - '.github/warden/linux-test/profiles/**'
      - 'scripts/ci-policy/linux_pins_test.go'

permissions:
  contents: read

jobs:
  test:
    name: Pinned offline test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            image: ghcr.io/klarlabs-studio/warden/linux-test@sha256:070129904c8b4dd3be7e2fba92761d10c227a5d0bdf44c7993a49bb776cc22ad
            config: sha256:bafb4e708638a0e6af0e072f6931ba32b0eace8c7d6c7220984664acbdb9b1e7
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/klarlabs-studio/warden/linux-test@sha256:e97a6c1dc0a1e3ad504528394bf675ed3aa58f66a75eedb73d561a3491090f24
            config: sha256:36715d0873bbd86edf9c0a73a810b56c3c1d78f81108d03d165f57e52887ae72
    env:
      IMAGE: ${{ matrix.image }}
      IMAGE_CONFIG: ${{ matrix.config }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify publisher and exact environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux-test-contract"
          cosign verify --certificate-identity \
            'https://github.com/klarlabs-studio/warden/.github/workflows/linux-test-image.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE" \
            > "$RUNNER_TEMP/linux-test-contract/signature.json"
          docker pull --platform "linux/$ARCH" "$IMAGE"
          docker image inspect "$IMAGE" > "$RUNNER_TEMP/linux-test-contract/image.json"
          jq -e --arg arch "$ARCH" --arg config "$IMAGE_CONFIG" \
            'length == 1 and .[0].Id == $config and .[0].Os == "linux" and .[0].Architecture == $arch' \
            "$RUNNER_TEMP/linux-test-contract/image.json"
      - name: Execute the pinned test contract
        run: |
          set -euo pipefail
          sudo chown -R 10001:10001 "$GITHUB_WORKSPACE"
          docker run --rm --network none --user 10001:10001 --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            "$IMAGE_CONFIG" /usr/local/bin/warden-linux-test
          test -s coverage.out
          cp coverage.out "$RUNNER_TEMP/linux-test-contract/coverage.out"
      - name: Retain observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-test-contract-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-test-contract/
          if-no-files-found: error
          retention-days: 14
