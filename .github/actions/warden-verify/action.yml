name: "Warden Verify"
description: >-
  Provenance-skip: report whether a commit was already validated by the warden
  gate with an explicitly trusted signer, so CI can reuse equivalent checks.
  Without a key pin, reports validated=false.

  This speaks about ONE COMMIT. It is not a statement about your branch's
  history — see warden-doctor for that, and see the note below before treating a
  green check here as provenance coverage.

inputs:
  commit:
    description: "Commit to verify"
    required: false
    default: ${{ github.sha }}
  remote:
    description: "Remote holding refs/notes/warden"
    required: false
    default: origin
  key:
    description: >-
      Trusted signer key(s) or fingerprint(s), comma-separated, pinned in the
      protected workflow. Without a non-empty pin, validated is always false
      and CI must run its checks. Get a fingerprint with `warden key show`.
    required: false
    default: ""
  requirements:
    description: "Optional protected JSON requirements file; requires a release supporting --requirements. Never load this policy from the untrusted candidate. Contains exact command, configuration, context, input and image expectations."
    required: false
    default: ""
  container-steps:
    description: "Optional comma-separated checks that must have trusted container execution evidence. Requires a warden release supporting --container-steps."
    required: false
    default: ""
  container-image-id:
    description: "Optional inspected sha256 image ID to require with container-steps."
    required: false
    default: ""
  min-profile:
    description: >-
      Optional minimum compliance profile (permissive, standard or strict) the
      note must conform to, recomputed from its signed observations rather than
      the recorded name. Single-commit only. Requires a warden release
      supporting --min-profile; an older binary rejects the flag, so validated
      is false and CI runs its checks.
    required: false
    default: ""
  warden-version:
    description: "warden version to install (e.g. v0.18.16, or 'latest')."
    required: false
    default: latest

outputs:
  validated:
    description: "true when the exact commit has intact provenance from an explicitly trusted signer"
    value: ${{ steps.check.outputs.validated }}

runs:
  using: composite
  steps:
    # Install from a released, checksum-verified binary — NOT `go install`.
    # Verifying provenance is not a Go build step, and requiring a toolchain made
    # this action fail before it verified anything in any repo without a root
    # go.mod (a monorepo whose module lives in a subdirectory), leaving the check
    # permanently red and therefore providing zero verification (#92).
    - name: Install warden
      shell: bash
      env:
        WARDEN_VERSION: ${{ inputs.warden-version }}
        # Resolving "latest" hits the GitHub API. Unauthenticated, that is
        # 60/hr shared across every runner on the same egress IP, so a busy
        # hour turned this REQUIRED gate red with `curl: (22) ... 403` —
        # an infrastructure failure indistinguishable, at a glance, from a
        # provenance violation. github.token raises it to 1,000/hr per repo
        # and needs no permission the action does not already have.
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/../install-warden.sh"

    - name: Fetch warden notes
      shell: bash
      env:
        WARDEN_REMOTE: ${{ inputs.remote }}
      run: git fetch -- "$WARDEN_REMOTE" 'refs/notes/warden:refs/notes/warden' || true

    # #212 §2: on a pull_request this verifies the PR head (or the ephemeral
    # merge commit), which still carries its note and therefore passes. The
    # squash commit that actually lands on the trunk is a NEW sha whose note does
    # not follow it. A repository ran the gate on every commit for months, kept
    # this check permanently green, and had 100% UNVERIFIED on its trunk.
    #
    # Say so, once, where somebody reading the log will see it. Silence here is
    # what made a green check read as coverage it never provided.
    - name: Note what this check does not cover
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        echo "::notice::warden-verify checks this PR's commit only. A squash merge creates a new sha whose note does not follow it — add the warden-doctor action on your trunk, and reattest at merge time, or trunk provenance can be zero while this check stays green."

    - id: check
      shell: bash
      env:
        WARDEN_COMMIT: ${{ inputs.commit }}
        WARDEN_TRUSTED_KEYS: ${{ inputs.key }}
        WARDEN_REQUIREMENTS: ${{ inputs.requirements }}
        WARDEN_CONTAINER_STEPS: ${{ inputs.container-steps }}
        WARDEN_CONTAINER_IMAGE_ID: ${{ inputs.container-image-id }}
        WARDEN_MIN_PROFILE: ${{ inputs.min-profile }}
      run: bash "$GITHUB_ACTION_PATH/verify.sh"
