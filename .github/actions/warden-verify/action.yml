name: "Warden Verify"
description: >-
  Provenance-skip: report whether a commit was already validated by the warden
  gate (an intact refs/notes/warden record), so CI can trust it and skip
  re-running the checks warden already ran.

  This speaks about ONE COMMIT. It is not a statement about your branch's
  history — see warden-doctor for that, and see the note below before treating a
  green check here as provenance coverage.

inputs:
  commit:
    description: "Commit to verify"
    required: false
    default: ${{ github.sha }}
  remote:
    description: "Remote holding refs/notes/warden"
    required: false
    default: origin
  key:
    description: >-
      Trusted signer key(s) or fingerprint(s), comma-separated. When set, the
      commit's note must also carry a valid signature from one of these keys —
      provenance-skip then means "a warden I trust ran here", not just "a warden
      ran here". Get a fingerprint with `warden key show`.
    required: false
    default: ""
  warden-version:
    description: "warden version to install (e.g. v0.18.16, or 'latest')."
    required: false
    default: latest

outputs:
  validated:
    description: "true when the commit carries an intact warden validation note"
    value: ${{ steps.check.outputs.validated }}

runs:
  using: composite
  steps:
    # Install from a released, checksum-verified binary — NOT `go install`.
    # Verifying provenance is not a Go build step, and requiring a toolchain made
    # this action fail before it verified anything in any repo without a root
    # go.mod (a monorepo whose module lives in a subdirectory), leaving the check
    # permanently red and therefore providing zero verification (#92).
    - name: Install warden
      shell: bash
      env:
        WARDEN_VERSION: ${{ inputs.warden-version }}
        # Resolving "latest" hits the GitHub API. Unauthenticated, that is
        # 60/hr shared across every runner on the same egress IP, so a busy
        # hour turned this REQUIRED gate red with `curl: (22) ... 403` —
        # an infrastructure failure indistinguishable, at a glance, from a
        # provenance violation. github.token raises it to 1,000/hr per repo
        # and needs no permission the action does not already have.
        GITHUB_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/../install-warden.sh

    - name: Fetch warden notes
      shell: bash
      run: git fetch "${{ inputs.remote }}" 'refs/notes/warden:refs/notes/warden' || true

    # #212 §2: on a pull_request this verifies the PR head (or the ephemeral
    # merge commit), which still carries its note and therefore passes. The
    # squash commit that actually lands on the trunk is a NEW sha whose note does
    # not follow it. A repository ran the gate on every commit for months, kept
    # this check permanently green, and had 100% UNVERIFIED on its trunk.
    #
    # Say so, once, where somebody reading the log will see it. Silence here is
    # what made a green check read as coverage it never provided.
    - name: Note what this check does not cover
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        echo "::notice::warden-verify checks this PR's commit only. A squash merge creates a new sha whose note does not follow it — add the warden-doctor action on your trunk, and reattest at merge time, or trunk provenance can be zero while this check stays green."

    - id: check
      shell: bash
      run: |
        KEY_ARG=()
        if [ -n "${{ inputs.key }}" ]; then KEY_ARG=(--key "${{ inputs.key }}"); fi
        if warden verify --commit "${{ inputs.commit }}" "${KEY_ARG[@]}" --quiet; then
          echo "validated=true" >> "$GITHUB_OUTPUT"
          echo "warden: ${{ inputs.commit }} already validated — CI can skip its checks."
        else
          echo "validated=false" >> "$GITHUB_OUTPUT"
          echo "warden: ${{ inputs.commit }} not validated — CI should run its checks."
        fi
