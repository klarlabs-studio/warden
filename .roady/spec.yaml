id: warden
title: warden
description: |-
  A configurable git commit/push gate that records verifiable provenance for every commit, and reports what it recorded to the people who have to rely on it.

  Warden's product is a distinction, not a feature list: the difference between "this was checked" and "someone says this was checked". It gates `git commit` and `git push` themselves — native hooks, no bot, no forge integration required — and writes a hash-chained evidence note signed by a key the forge already knows.

  Producing the record was the first half. The second half is consumption, and it is where 0.25.0–0.29.2 went: a repair for the commits the forge itself creates on merge, a verdict warden can publish when CI cannot run at all, a signed statement that survives being carried by somebody else, and a period-scoped evidence package an auditor can reconcile against `git log`.

  The recurring defect in this codebase, named in its own commit history, is warden asserting more than its evidence supports. The design decisions below exist to keep a strong claim and a weak one impossible to confuse.
features:
    - id: provenance-gate
      title: Provenance Gate
      description: |-
        Gate git commit and push through native hooks, run the configured policy, and record a hash-chained evidence note. Each entry carries the previous entry's hash, so a consumer walks the chain rather than trusting a summary.

        The note is signed, and the trusted-signer roster is read from the range's BASE ref — never from the head being verified, which would let the thing under inspection nominate its own inspector.
      requirements: []
    - id: dependency-drift
      title: Dependency Drift, Recorded Rather Than Warned About
      description: |-
        Warden exposes `node_modules` from the live checkout rather than reinstalling — a per-run `npm ci` is the dominant cost on a large JS repo — so the tracked tree comes from the commit and the dependency tree comes from the machine. The two can disagree: a branch switch without a reinstall, a local `npm link`, a half-applied upgrade. `git.DetectDepDrift` compares each committed lockfile against npm's `node_modules/.package-lock.json`, the manifest of what is actually installed — two file reads and a map diff, no install and no network (0.25.0, #210).

        The detection goes IN the note (`dependencies_drifted`, 0.26.0, #204), not into a terminal warning. `dependencies` digests the lockfiles the COMMIT carries, and those digests were never a claim that the run resolved against them — a caveat that lived only in a source comment, where no verifier could read it. A signed note showing digested lockfiles and nothing else overclaims by omission, and terminal output is ephemeral while the note is the durable artifact warden exists to produce. So the field sits inside the evidence chain and the signature.

        Best-effort by construction, and the record does not pretend otherwise: an absent field means nothing was DETECTED, not that the install was verified. yarn and pnpm write no equivalent manifest, and a never-installed tree reports nothing.
      requirements: []
    - id: external-attestation
      title: External Attestation
      description: |-
        `warden attest-external` records an existing CI run as a commit's attestation instead of re-running the same checks on the same tree (ADR 0003, #177, shipped 0.24.0).

        Deliberately a separate command rather than a flag on `run`: `run` means "run the pipeline", and a flag on it meaning "run nothing" would put a strong claim and a weak one on one code path. `--checks` is required and never inferred — every other detected field is a fact the platform states about itself, while what passed is a claim about work warden did not do.

        `verify` refuses external attestations by default (`--allow-external` defaults to false); `service.ExternalPolicy` selects the stance.
      requirements: []
    - id: squash-merge-recovery
      title: Surviving the Squash Merge
      description: |-
        `gh pr merge --squash --delete-branch` is the default merge path on most repositories, and until 0.27.0 it destroyed provenance silently. A field report (#212) from a repo that had gated every commit for months and still showed 100% UNVERIFIED on its trunk drove all of the below.

        A git note SURVIVES garbage collection; the commit it annotates does not. Deleting the merged branch — the default, and what removing a worktree does too — makes the attested commit unreachable, the next gc prunes the object, and the note is left dangling over nothing. Re-attestation then failed in the least helpful way available: the sha was still listed, `TreeSHA` errored, the candidate was skipped silently, and the squash commit read as though it had never been gated. The field report blamed notes staying local; the gate already pushes them, so that was never the mechanism.

        Attested commits therefore get a ref under `refs/warden/attested/`, written at gate time and at re-attestation and pushed alongside the notes, so the evidence keeps something to be evidence about. `reattest --all` backfills anchors for notes written before this existed; commits already collected are skipped, because there is nothing left to save.

        A re-attestation carries the ORIGINAL record whole in `carried_original` rather than re-signing with the local key. Re-signing is invisible on a developer machine, where the local key is usually the one that signed the original, and fatal on a runner, where it is ephemeral — the repository's own roster correctly rejected the result, so an automatic merge-time repair would have needed a provenance-signing key as a CI secret. Copying the source SIGNATURE is not available either: it covers a payload containing `CommitSHA`, so a copied note would verify while attesting the WRONG commit, and commit binding is exactly what stops a signed note being transplanted. Instead a verifier judges facts it can check itself — the carried record is validly signed by a roster key and attests the source, and the two commits have IDENTICAL TREES, read from git objects rather than claimed by the note. The re-attester contributes only a pointer, and a wrong pointer fails the tree comparison, so it needs no trust and no key.

        `carried_original` sits deliberately OUTSIDE the signing payload. Any new field inside it changes the bytes every version signs over, so a warden that predates the field drops it, re-marshals, and reports "signature does not verify" — which reads as tampering rather than version skew.

        The `warden-reattest` action runs on `pull_request: [closed]` — the only moment at which the squash commit exists and the branch has not been deleted, which is what makes the repair automatic instead of something to remember.

        DONE in the same release: an untrusted note no longer squats a commit. Re-attestation stopped at `Attests()` — evidence, chain, and commit binding — which says nothing about WHO signed, so anything able to write a note could permanently block a trusted one. The asymmetry was the tell: the same code already refused to copy FROM an untrusted note while refusing to REPLACE one, so warden was stricter about what it carried than about what it defended.
      requirements: []
    - id: out-of-band-status
      title: Reporting When the Forge Cannot
      description: |-
        A gate that cannot report is a gate nobody can rely on, and the interesting case is the one where the forge itself is what stopped working. A private repository past its Actions spending limit does not FAIL its jobs — it never starts them: every required check reports `failure` with zero steps executed, and every pull request is blocked indefinitely. The gate still ran locally and still wrote a signed note; it had no way to tell the forge (0.29.0, #220; docs/status-without-ci.md).

        With `status: {enabled: true}`, a passing, pushed run posts a commit status through the `gh` CLI already used for pull requests — no Actions minutes, no runner, no token held by warden.

        The context is `warden/gate`, a name warden ALONE writes. Publishing under the Action's own job name was the first attempt and does not work: GitHub keeps a status and a check run as separate entries under a shared name and requires both to pass, so the green status just sat beside the Action's red check run. Requiring `warden/gate` is therefore an explicit protection change, which is the honest shape — a repository is choosing to accept a locally-produced verdict, and that choice should be made rather than inherited.

        Off by default: publishing writes to a surface other people read as CI, and nobody should acquire that behaviour by upgrading. A failing gate publishes nothing. A forge that refuses the status produces a warning, never a rollback — the push has already happened by then.

        DONE in 0.29.1 (#223): GitHub refuses a status for a SHA it has never received, and when git is completing the push the branch has not arrived at the moment the gate finishes. The publish was relying on the bulk anchor push that rides along with the notes, which is best-effort and deliberately silent about failing — so on two repositories the gate reported success, the status 422'd with "No commit found for SHA", and nothing said so. Warden now pushes that one commit's anchor, checks the result, and skips the publish WITH THE REASON when the remote refuses, rather than calling the forge about a commit it cannot see.
      requirements: []
    - id: signed-attestation
      title: Signed Attestation Export
      description: |-
        `warden attest` projects a commit's `refs/notes/warden` record into an in-toto statement (ADR 0002 Phase 3) for sigstore/GUAC interop. `--predicate vsa` emits a SLSA Verification Summary Attestation (#147) — "someone verified this, and here is the result", which is one layer earlier than build provenance and is what warden actually knows.

        `--sign` (#215) emits a DSSE envelope signed with the SAME key that signs notes. Before it the statement went out bare, and its own doc comment named the consequence: wrap it yourself. In practice whatever carries a statement onward does that wrapping — and a re-signed statement attests to the CARRIER. A build platform attaching warden's verdict to a container image produced an envelope signed by the build platform, leaving a consumer able to conclude only "the builder says warden said this", which is not what warden said. Signed by warden's key, the claim reaches whoever ends up holding it verifiable against warden's public key and nothing else, and one trust decision — the roster in `.warden.yaml` — still governs both notes and statements.

        The envelope names the signing fingerprint as its keyid, so a verifier holding a roster selects the right key rather than trying each in turn. DSSE's pre-authentication encoding binds the payload TYPE and the length of each field into what is signed rather than signing the payload alone, so identical bytes cannot be re-presented under a different media type; its exact byte layout is the interoperability contract, and a test pins it to the space. Asking for a signature when no key is available is an error rather than an unsigned envelope — a caller who asked for a signature and silently got none would ship something nobody can verify.
      requirements: []
    - id: grc-evidence
      title: Evidence for the Person Who Signs the Opinion
      description: |-
        `warden audit` answers a developer's question: is this branch's provenance intact. An auditor asks a different one — over this period, what changed, which changes went through the control, and what are the exceptions — and answering it from `audit` output meant a spreadsheet and a covering note every quarter. `warden evidence` answers it directly (0.29.1, #222; docs/grc-evidence.md).

        Same underlying records, deliberately: two commands that could disagree about what happened would make both useless. Three readers, three formats — `--format md` for the human who signs the opinion, `json` (versioned `warden.evidence/v1`) for a GRC platform to ingest on a schedule, and `oscal` for tooling that speaks NIST assessment-results. `--from`/`--to` scope the period, `--frameworks` selects control catalogues, and an unknown framework name is rejected rather than silently producing a thinner report than the one somebody thinks they asked for.

        What makes it evidence rather than a report: a complete POPULATION rather than a sample, reconcilable against `git log` — the usual failure of home-grown evidence is a list of the changes that went well; exceptions carrying the SPECIFIC reason warden could not vouch for each commit, so a bypass, a never-pushed branch and a squash-merge binding gap are not one undifferentiated red; a stable digest over the population and its verdicts but not the timestamps around them, so a re-run can be told from an edit; and the verification command printed inside the document, so the verdicts can be re-derived without trusting the document or whoever produced it.

        Every mapped control states what it does NOT evidence next to what it does — approval, check adequacy, deployment, key custody. Evidence is rejected for claiming too much far more often than for proving too little.

        DONE in 0.29.2 (#225): `--approvals` reads the forge's record — the pull request each change arrived through, its author, and who approved it. Warden observes the gate and not the review, so change-management evidence that stops at "these checks ran" is half a control. Four states are kept deliberately apart: approved by someone else, self-approved only, nobody approved, and no pull request at all. A self-approval is a record of a review that did not happen and is counted as such; a bot approval never counts on its own. Expect an uncomfortable number the first time it is run — a single-maintainer repository shows zero independent approvals, because that is true, and the report says so instead of leaving an auditor to find out. Opt-in: one forge call per commit.

        DONE in #246 — the RULE, not only the outcome. `--approvals` reported what happened: twelve changes, twelve independent approvals. Two repositories produce that identical line, one where review is required and enforced and one where it merely happened and could be skipped tomorrow; the first has a control and the second a habit, and an auditor could not tell them apart. The report now states the forge's branch rule BEFORE the counts, and the CC8.1 text varies with it, so "0 independent approvals" reads as the configuration choice it is rather than as N control failures. `enforce_admins` is never omitted, because it decides whether every other rule is a requirement or a default an admin may merge past.

        Three states kept apart, for the reason the feature exists at all: reading branch protection needs admin rights, so a 403 is warden failing to LOOK while a 404 is the forge answering that there is no rule. Folding them would put a control-gap accusation in an evidence document on the strength of a permission warden does not hold. The feature also carries its own limit in the report — forges expose no history of protection settings, so the rule shown is the one in force when the report was produced, not the one that applied to each historical change.

        DONE in 0.29.2 (#226): the adoption point was read from `.git/warden/adoption` — local, untracked, per-clone state — so a fresh clone got "warden was never initialized in this repo" and no report at all. Tolerable for `warden doctor`; fatal here, because an artifact only one laptop can produce is not evidence: the person checking it cannot reproduce it. Six of eight repositories in one fleet were in exactly that state. When the file is absent the point is now derived from `refs/notes/warden`, which is shared — the parent of the earliest noted commit on the branch, the point at which the gate demonstrably began operating. Same population, same digest, on any clone; a repository with no notes says nothing has been gated rather than inventing a start date.

        DONE in #229 (2026-08-23), and the textbook instance of this project's constraint: `--approvals` treated a broken or unauthenticated `gh` exactly like a forge with nothing to report. Every commit came back "not associated with a pull request", and the document asserted as FACT that every change had bypassed review, when what actually happened is that warden could not look. Being closed by a `Reachable()` preflight that refuses the run outright — `Available()` answers "is the CLI here", which is all a best-effort PR comment needs, and is too weak for anything read as evidence — plus an explicit undetermined state, read from the HTTP status rather than the exit code so a 401 and a genuine 404 stay distinguishable, counted and reported apart from "no pull request". Not looking is not a finding. Shipped alongside it: the document identified the repository by `os.Getwd()`, so the same repository produced a different header on every clone and the artifact was not reproducible by its reader; the remote URL is the identity somebody else can act on.
      requirements: []
    - id: forge-authored-commits
      title: Telling a Bypass From a Commit Nobody Touched
      description: |-
        warden's gate is a client-side pre-push hook, so a commit the FORGE creates — a squash merge, a web edit, a Dependabot or nox remediation commit — was never on a machine where warden could run. Under a REQUIRED gate it can never pass, so a repository either stops merging bot pull requests or reaches for the admin override. Measured here, not theorised: #217 was closed unread, #218 and #219 sat blocked for days, and docs/ci-provenance-gate.md had predicted exactly that outcome.

        Shipped in 0.30.0 (#234) as two halves, and the first is unconditional. `ReasonForgeAuthored` names the cause whatever the policy says; the default still FAILS the commit. Naming a cause is not permission to ignore it — the same separation `honest-diagnostics` keeps everywhere else.

        The second half is opt-in (`forge.accept_authored`) and the care went into what it keys on. The obvious signal, committer `GitHub <noreply@github.com>`, is free text set with one flag; a gate reading it enforces nothing. GitHub SIGNS what it creates, so the check requires a signature git could actually VERIFY against a pinned FULL fingerprint. Measured rather than assumed: for a commit whose key is absent from the keyring git reports `%G?=E` with an EMPTY `%GF`, while `%GK` — the 64-bit key id — stays populated, because it is a field inside the signature packet put there by whoever produced it. The key id is therefore exactly as trustworthy as the thing being checked and is never matched on.

        Read from the range's BASE ref, like the trusted-signer roster and for the same reason: a pull request able to enable this in its own head would be deciding whether it has to be gated. A base config that will not parse leaves the rejecting zero value in place — failing open would mean a broken `.warden.yaml` silently widened the gate. Accepted commits are counted and reported apart ("warden ran NO checks on them"), because a weaker claim that reads as a stronger one is the failure this project exists to prevent.

        GitHub-specific by design: a self-hosted GitLab or Gitea may not sign what it creates, and there is nothing safe to key on when it does not.

        A gap worth recording, found in #237: every test shipped with the feature passed ForgeKeys and ForgePolicy DIRECTLY into RangeVerifyOptions, so all of them would have passed if `.warden.yaml` were never read at all. The config-to-policy path had no coverage until it was tested in both directions.
      requirements: []
    - id: honest-diagnostics
      title: Honest Diagnostics
      description: |-
        A failure message must name the failure that actually occurred. A wrong diagnosis costs more than a vague one.

        DONE in 0.24.1 (#195, #196): `verdictFor` collapsed a note read ERROR into the absent case, so a corrupt note reported "no warden note (pushed with --no-verify, or made outside warden)" — naming two causes that were both wrong, and sending the reader to hook configuration while the real remedy was restoring the blob. `ReadNote` already distinguished the two; the distinction was discarded one line later. Added the `unreadable` reason.

        DONE in 0.24.2 (#203): a gated push that could not write its note said nothing — and, because signing runs first, printed `provenance note written UNSIGNED: …`, asserting a note had been written when none was. The write stays best-effort, since the push has already happened, but is no longer silent, and the two warnings are now mutually exclusive. In the same release: `Counts` re-derived its classification from `HasNote` instead of the commit-state partition the rest of the domain uses, so an ordinary three-commit PR printed all ✓ and exited 1, and a branch with no remote-tracking ref printed "These are not bypasses" directly above the exit code that failed on it. Two classifications of one fact, and the suite only ever asked the one that was right.

        DONE in 0.27.0: `warden status` reports which provenance MODE the repository is in — with no `trusted_keys` a note proves "a warden ran here", not "a warden I trust ran here", a distinction that previously took reading the verify action's YAML to discover while hooks reported armed and the repository looked healthy. `warden doctor --ci` exits 3 on drift, because drift and a doctor that COULD NOT RUN were both exit 1, so an unadopted repository or a shallow clone was reported as tidy, actionable drift. And `warden-verify` now states on every PR what it does not cover: it checks one commit, normally the PR head, which still carries its note and passes, so it could stay green permanently while trunk provenance was zero.

        DONE in 0.28.0: after every upgrade, an armed shim reported `hook pins 0.26.0, PATH has 0.27.0 - running 0.27.0` on every single run until somebody re-pinned by hand. The notice described a difference that changed nothing — a warden on PATH runs whatever the pin records — and a permanent warning with no action behind it is how a gate teaches people to read its output past rather than at. A run now re-pins its own shims, before gating, and only FORWARD: pinning backward would turn one developer running an old binary into a repository that fetches an old binary for everyone. Re-pinning could also move the pin and say NOTHING, because it went through `SetHook`, which installs the shim first and writes the config second; `RepinHook` rewrites the shim and nothing else, which is all a re-pin ever meant.

        DONE in 0.29.1: an unstamped binary reported the version it was built FROM — a literal in the source — so anything installed with `go install` claimed that number indefinitely. A nuisance in `warden --version`, and a defect in `warden evidence`, where the producing tool's version is part of an artifact somebody signs. It now reads the module version, or `dev+<commit>`, from the embedded build info.

        DONE in #229 (2026-08-23): the hook shim time-boxes a `warden --version` call so a binary that cannot start fails fast rather than wedging every commit, then treated ANY non-zero result as proof the binary was broken — telling a developer whose machine was merely loaded enough to blow the 15s budget to strip a Gatekeeper quarantine or reinstall. The timeout convention (124) is now distinguished from a genuine failure to run. Both still fail closed; they no longer share a cause. Found because it was also failing warden's own suite (#228) at 60s against a 15s budget where it takes 0.33s standalone.

        DONE in #231 (2026-08-23) — the FOURTH instance of this shape in `cmd_verify.go`'s history, and the one that says most about how it survives: `warden verify` named two causes that were each the OPPOSITE of the truth. A commit with no note reported "note is unsigned but a trusted key was required"; a commit whose note does not attest it reported "no intact warden note". `res.Signed` is false in two different worlds — an unsigned note, and no note — so with a roster configured the absent case was caught by `pinned && !res.Signed` and the honest branch beneath it became unreachable. Both now key off `Record`, nil ONLY when the note is absent, since `VerifyWithPolicy` returns an error when a note cannot be READ: the same absent/unreadable distinction 0.24.1 introduced and this code discarded one layer up.

        The mechanism worth keeping: three of the six `printVerify` fixtures described notes that EXIST — signed, invalid signature, unsigned — while constructing no `Record` at all. They asserted note-property messages against the absent-note state, so the suite agreed with the code about a world neither had modelled. AGENTS.md's line about tests written from the same mental model as the code was not a general caution here; it was the specific reason two wrong messages shipped and stayed. Fixtures that under-specify their fixture are a distinct hazard from tests that assert the wrong thing.

        DONE in #238 (2026-08-23) — the same shape at a fourth site, and this one was reported about warden's OWN trunk: `doctor` said "UNBOUND (note describes another commit — history was rewritten)" for seven commits whose notes describe NO commit. `commit_sha` is empty in every one, all were written by warden 0.8.3–0.9.0 between 4 and 6 July 2026, before records were bound to commits at all (0.10.0), and nothing had been rebased. `BindsTo` is false in two different worlds and `AttestDefect` returned one defect for both, so the label asserted a cause that had not occurred and pointed the reader at `reattest`, which can do nothing for a note with no binding to repair. `DefectUnbindable` separates them, checked BEFORE the mismatch case because the empty value also fails `BindsTo`.

        Decided in the same change and worth keeping: those commits are NOT reclassified as "outside the control". The control WAS operating — a gate ran and recorded it — so calling them ungoverned understates what happened, and moving them would shrink the exception count by editing its definition rather than by fixing anything. An exception count that falls because the bar moved is what an auditor is entitled to be suspicious of. `warden evidence` instead states how many exceptions are PERMANENT, so a reader does not mistake a limitation for a backlog.

        DONE in #236 (2026-08-23), mechanism rather than diagnosis: duplicate `### Fixed` / `### Changed` headings inside one release had appeared four times, and 0.29.2 SHIPPED with a byte-identical section repeated. Not carelessness — several pull requests each append their own section to `## [Unreleased]`, every one of those diffs is correct in isolation, and only the ASSEMBLED file is wrong. A test in `scripts/` now checks it on every push. Two of its three assertions failed on first run and both were the CHECK being wrong, not the file; fixing the changelog to satisfy them would have been the wrong direction.

        OPEN, same class — re-checked against the code on 2026-08-23 and still open: `WriteNote` writes with `git notes add -f -m` and never reads the blob back, so a note corrupted into two concatenated records is discovered only at verify time, as an `unreadable` verdict on somebody else's machine. Warden's own reconcile path cannot produce that shape — `mergeAndRetryNotes` uses git's DEFAULT strategy on purpose, which unions non-overlapping notes and FAILS on a real conflict rather than resolving it by concatenation — but a hand-run `git notes merge -s cat_sort_uniq` does, and is how the 0.24.1 corruption arose. Detecting and refusing the shape at write time remains unbuilt.
      requirements: []
    - id: coverage-and-review-debt
      title: Coverage and Review Debt
      description: |-
        Tracked in #194, which is now closed. Warden passes every gate it defines for itself — gofmt, vet, full suite, 9 of 9 coverage domains, nox security scan. These are the gaps BETWEEN passing those gates and being reviewed.

        DONE:
        - AttestExternal 72.0% -> 76.0% (#198, 2026-08-02). Covers the unresolvable commitish, and the deliberate defaulting of an empty ref.Commit — asserting the record is genuinely BOUND rather than merely storing the SHA, since a record that stores it without attesting proves nothing.
        - cli 80.9% -> 81.5% (#199, 2026-08-03). noteDefectLabel and stepObserver.OnStep were both at 0%. Both guard against a failure that reads as a pass: an unrecognized defect rendering as a blank (a clean row in the doctor table), and a partial transcript a polling caller could mistake for a complete one. Both mutation-checked.
        - AttestExternal 76.0% -> 88.0% (#201, 2026-08-03), which closed the item asking for injected failures rather than a fixture repo — the signer is an unexported field and the tests are in-package, so it is set to nil directly, and the push is failed by pointing the service at a remote that does not exist. Both branches encode a decision rather than an error return: an unsigned external attestation is refused outright AND leaves no note behind, because a half-written attestation would look present and prove nothing; and a failed push under `--push` surfaces as an error saying "not published" while still returning the local note and RunID, since reporting otherwise sends an operator to re-attest when they only need to publish.
        - cli 81.3% -> 83.0% (#208, 0.24.3). `why`, `attach` and `reattest --all` covered through their real OUTPUT — the trace notarization line's three states, the base-policy and unsigned wordings, the no-live-run answer — rather than left to the domain average.
        - The 0.24.0 trust-boundary review was extended past its 285-line boundary and found two more over-claims (#203, 0.24.2), both recorded under Honest Diagnostics. Reading beyond the boundary found what the boundary statement predicted it would.

        OPEN:
        - `cli` is the domain closest to its floor and is exempt from the per-file rule by design — command entry points block on stdio, so a per-file floor would measure how testable a `main()` is rather than whether logic is tested. The consequence is domain-level enforcement only, in the domain where every new command lands. The headroom #208 bought has since been spent: five releases of new commands later (`evidence`, `status`, the `reattest` sweep, `--approvals`), a package-level `go test -cover ./internal/cli` on 2026-08-23 measures 80.6% against an 80.0% floor. Both functions covered by #199 sat at 0% and nothing in the tooling would have flagged them.
        - The GRC/evidence surface added across 0.29.x has had no equivalent trust-boundary review, and it is the surface whose output is read by people who are not in a position to check it against the repository.
      requirements: []
constraints:
    - id: evidence-over-assertion
      title: Never assert more than the evidence supports
      description: |-
        The failure this project exists to prevent, and the one it keeps reproducing. It applies to warden's own diagnostics as much as to the claims it records: a message naming the wrong cause is the same defect as a gate that passes without checking.
version: 0.5.0
